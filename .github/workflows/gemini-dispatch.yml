name: 'Gemini Dispatch'

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: '${{ github.workflow }}-${{ github.event.issue.number }}'
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      contains(github.event.comment.body, '@gemini-cli') ||
      contains(github.event.issue.body, '@gemini-cli')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are assisting in the repository ${{ github.repository }}.
            A user triggered you in Issue #${{ github.event.issue.number }}.
            User request:
            ${{ github.event.comment.body || github.event.issue.body }}

            Analyze the codebase, make the requested file edits directly in the workspace, and create a new branch and Pull Request (or commit directly if instructed) with a clear explanation of your changes.
