name: 'Gemini Dispatch'

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: '${{ github.workflow }}-${{ github.event.issue.number }}'
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      contains(github.event.comment.body, '@gemini-cli') ||
      contains(github.event.issue.body, '@gemini-cli')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
      GEMINI_MODEL: 'gemini-4-hydrogen'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          settings: |
            {
              "model": {
                "name": "gemini-4-hydrogen"
              }
            }
          prompt: |
            You are assisting in the repository ${{ github.repository }}.
            A user triggered you in Issue #${{ github.event.issue.number }}.
            User request:
            ${{ github.event.comment.body || github.event.issue.body }}

            Analyze the codebase, make the requested file edits directly in the workspace, create a new branch, commit your changes, push the branch, and open a Pull Request using `gh pr create` with a clear explanation of your changes.
